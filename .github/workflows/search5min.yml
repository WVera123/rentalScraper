name: Rental Scraper Arnhem Region

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Update pypararius
        run: pip install --update pypararius

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated seen listings
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add seen_listings.json
          git diff --quiet || git commit -m "Update seen listings"
          git push
